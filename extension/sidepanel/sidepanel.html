<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TLDW AI</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <h2 class="logo">🎥 TLDW AI</h2>

    <div class="card">
        <h3 id="videoTitle">No Video Detected</h3>
        <p id="status" class="status">🔴 No Video</p>

        <button id="processBtn">
            Process Video
        </button>
    </div>

    <div class="card">
        <label>Ask about this video</label>
        <textarea id="question" placeholder="Ask anything..."></textarea>

        <button id="askBtn">
            Ask
        </button>
    </div>

    <div class="card">
        <h3>Conversation</h3>
        <div id="chatContainer"></div>

        <button id="copyBtn" disabled>
            📋 Copy Last Answer
        </button>
    </div>

    <h3>Suggested Questions</h3>
    <div id="suggestions"></div>

    <script src="../libs/marked.min.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
